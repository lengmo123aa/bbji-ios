<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>BB鸡 · 手机端全部页面（含点击后的下一页与效果）</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --blue:#0A84FF;--blue-d:#0A6FD8;
    --ink:#0B0D12;--ink2:#2C323C;
    --sec:#8A93A0;--ter:#AAB2BD;
    --sep:rgba(60,60,67,.085);
    --page:#F4F6FA;--card:#FFFFFF;--search:#EBEEF4;
    --red:#FF3B30;--orange:#FF9500;--green:#34C759;--purple:#7B5CF0;--pink:#F2557D;--teal:#1E9EE0;
  }
  body{
    background:linear-gradient(168deg,#EDF1F8 0%,#F4F6FA 55%,#FAF7F4 100%);
    padding:40px 26px;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  .board{display:grid;grid-template-columns:repeat(4,282px);gap:34px 28px;justify-content:center}

  /* ================= 外壳 ================= */
  .ph{width:282px;height:596px;border-radius:44px;background:#0B0E13;padding:6px;position:relative;
    box-shadow:0 16px 36px rgba(84,112,158,.15)}
  .ph::after{content:"";position:absolute;inset:3px;border-radius:41px;
    border:1px solid rgba(255,255,255,.085);pointer-events:none}
  .scr{position:relative;width:270px;height:584px;border-radius:38px;overflow:hidden;
    display:flex;flex-direction:column;background:var(--page)}
  .island{position:absolute;left:50%;top:7px;transform:translateX(-50%);width:66px;height:17px;
    border-radius:9px;background:#0B0E13;z-index:40}
  .home{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);width:100px;height:4px;
    border-radius:2px;background:rgba(11,13,18,.20);z-index:40}

  /* ================= 状态栏 ================= */
  .st{height:32px;flex:none;align-self:stretch;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 17px 4px;font-size:10.5px;font-weight:600;color:var(--ink);letter-spacing:.15px}
  .st .r{display:flex;align-items:center;gap:3.5px}

  /* ================= 图标 ================= */
  .ico{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round;flex:none}
  .ico.s{width:13px;height:13px;stroke-width:1.7}
  .ico.l{width:19px;height:19px}
  .ico.xl{width:22px;height:22px}

  /* ================= 导航 ================= */
  .ltitle{padding:2px 18px 12px;display:flex;align-items:flex-end}
  .ltitle h1{font-size:25px;font-weight:700;color:var(--ink);letter-spacing:-.8px;line-height:1}
  .ltitle .r{margin-left:auto;color:var(--blue);display:grid;place-items:center;padding-bottom:1px}
  .navbar{height:42px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px}
  .navbar .back{color:var(--blue);display:grid;place-items:center;width:14px;stroke-width:2}
  .navbar .nt{flex:1;min-width:0}
  .navbar .nt .n{font-size:14.5px;font-weight:600;color:var(--ink);letter-spacing:-.2px;
    display:flex;align-items:center;gap:5px}
  .navbar .nt .s{font-size:10px;color:var(--sec);margin-top:1.5px}
  .navbar .rs{display:flex;gap:13px;color:var(--blue);align-items:center}
  .navbar .ctr{flex:1;text-align:center;font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.2px}

  .av{border-radius:50%;flex:none;object-fit:cover;background:#E7EBF1;display:block}
  .av.n{width:40px;height:40px}
  .av.m{width:30px;height:30px}
  .av.s{width:24px;height:24px}
  .av.xl{width:84px;height:84px}

  /* ================= 搜索 ================= */
  .srch{margin:0 14px 10px;height:34px;border-radius:11px;background:var(--search);
    display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12px;color:#98A1AE}
  .srch .ico{color:#9AA3B0;stroke-width:1.7}

  /* ================= 分组列表 ================= */
  .grp{margin:0 14px 12px;background:var(--card);border-radius:13px;overflow:hidden;
    box-shadow:0 1px 2px rgba(84,112,158,.04)}
  .grp:last-of-type{margin-bottom:0}
  .ghead{font-size:11px;color:var(--sec);font-weight:400;padding:14px 20px 6px;letter-spacing:.2px}
  .row{display:flex;align-items:center;gap:10px;padding:6px 16px;position:relative;
    font-size:12.5px;color:var(--ink);font-weight:400;min-height:36px}
  .row.tall{min-height:44px;padding:7px 16px}
  .row + .row::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
  .row.ic + .row.ic::before{left:47px}
  .row .v{margin-left:auto;font-size:11.5px;color:var(--ter);font-weight:400}
  .row .ch{color:#C9D0D9;display:grid;place-items:center;margin-left:auto;stroke-width:1.7}
  .row .v + .ch{margin-left:6px}
  .row.danger{color:var(--red);justify-content:center}
  .row .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
  .row .ic .ico{width:12px;height:12px;stroke-width:1.8}
  .c1{background:var(--purple)}.c2{background:var(--pink)}.c3{background:var(--orange)}
  .c4{background:var(--blue)}.c5{background:var(--green)}.c6{background:var(--teal)}
  .c7{background:#9AA6B4}.c8{background:#B4BECB}
  .sw{width:38px;height:23px;border-radius:11.5px;background:#E6EAF0;position:relative;flex:none;margin-left:auto}
  .sw i{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;
    box-shadow:0 1px 2.5px rgba(60,60,67,.18)}
  .sw.on{background:var(--green)}.sw.on i{left:17px}
  .btn{height:42px;border-radius:12px;background:#FFF1F2;color:#FA5A52;font-size:13px;font-weight:500;
    display:grid;place-items:center;margin:14px 14px 0}

  /* ================= 聊天列表（无卡片） ================= */
  .plainlist{flex:1;overflow:hidden}
  .li{display:flex;align-items:center;gap:11px;padding:8px 16px;position:relative;background:transparent}
  .li + .li::before{content:"";position:absolute;left:0;right:0;top:0;height:.5px;background:var(--sep)}
  .li.pin{background:rgba(10,132,255,.045)}
  .li .tx{flex:1;min-width:0}
  .li .nm{font-size:13.5px;font-weight:600;color:var(--ink);letter-spacing:-.2px;
    display:flex;align-items:center;gap:6px}
  .li .pv{font-size:12px;color:var(--sec);margin-top:2.5px;font-weight:400;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .li .rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none;padding-left:6px}
  .li .tm{font-size:11px;color:var(--ter);font-weight:400}
  .bdg{min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;
    font-weight:600;display:grid;place-items:center;padding:0 5px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--red)}
  .chip{font-size:9px;font-weight:600;color:var(--blue);background:rgba(10,132,255,.10);
    border-radius:4px;padding:1.5px 5px;letter-spacing:.2px;flex:none}
  .chip.grey{color:#8A93A0;background:rgba(120,130,145,.11)}
  .chip.fire{color:#F2557D;background:rgba(242,85,125,.11)}
  .mute{color:#B9C1CB;display:grid;place-items:center}
  .tick{color:var(--blue);display:grid;place-items:center;opacity:.9}
  .pinmark{color:var(--blue);opacity:.75}

  /* ================= 底部 Tab ================= */
  .tab{height:58px;flex:none;display:flex;align-items:flex-start;padding-top:8px;
    background:rgba(250,251,253,.94);border-top:.5px solid var(--sep)}
  .tab div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
    font-size:9px;color:#A4ACB8;font-weight:400;letter-spacing:.1px}
  .tab div.on{color:var(--blue);font-weight:500}
  .tab .ico{width:19px;height:19px;stroke-width:1.7}

  /* ================= 聊天气泡 ================= */
  .chat{flex:1;padding:4px 14px 8px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
  .day{text-align:center;font-size:10.5px;color:var(--ter);font-weight:400}
  .sysmsg{text-align:center;font-size:10.5px;color:var(--ter)}
  .who{font-size:10.5px;color:var(--sec);margin:0 0 4px 36px}
  .ln{display:flex;gap:8px;align-items:flex-start}
  .ln.me{justify-content:flex-end}
  .b{max-width:186px;padding:9px 12px;border-radius:16px;font-size:12.5px;line-height:1.45;
    background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(84,112,158,.045);word-break:break-word}
  .b.m{background:var(--blue);color:#fff;box-shadow:0 1px 2px rgba(10,132,255,.14)}
  .b.q{position:relative;overflow:hidden}
  .b .quote{border-left:2px solid rgba(10,132,255,.35);padding-left:8px;margin-bottom:6px;
    font-size:11px;color:var(--sec);line-height:1.4}
  .b.m .quote{border-left-color:rgba(255,255,255,.5);color:rgba(255,255,255,.82)}
  .b.pic,.b.file{padding:0;overflow:hidden}
  .b.pic img{display:block;width:132px;height:132px;object-fit:cover}
  .b.file{display:flex;align-items:center;gap:10px;padding:10px 12px;width:172px}
  .b.file .fi{width:34px;height:34px;border-radius:9px;background:rgba(10,132,255,.10);color:var(--blue);
    display:grid;place-items:center;flex:none}
  .b.file .fn{font-size:12px;font-weight:500;color:var(--ink)}
  .b.file .fs{font-size:10px;color:var(--sec);margin-top:2px}
  .voice{display:flex;align-items:center;gap:8px;width:150px}
  .voice .pw{width:26px;height:26px;border-radius:50%;background:rgba(10,132,255,.10);color:var(--blue);
    display:grid;place-items:center;flex:none}
  .b.m .voice .pw{background:rgba(255,255,255,.22);color:#fff}
  .voice .wv{flex:1;display:flex;align-items:center;gap:1.6px;height:16px}
  .voice .wv i{width:2px;border-radius:1px;background:#C3CEDB;display:block}
  .b.m .voice .wv i{background:rgba(255,255,255,.62)}
  .voice .t{font-size:10.5px;color:var(--sec);flex:none}
  .b.m .voice .t{color:rgba(255,255,255,.85)}
  .receipt{font-size:9.5px;color:var(--ter);margin-top:4px;text-align:right}
  .receipt.blue{color:var(--blue);opacity:.75}
  .burnbar{display:flex;align-items:center;justify-content:center;gap:5px;font-size:10px;
    color:#F2557D;background:rgba(242,85,125,.075);padding:6px 0;flex:none}
  .cbar{flex:none;display:flex;align-items:center;gap:9px;padding:9px 14px 20px;
    background:rgba(252,253,255,.94);border-top:.5px solid var(--sep)}
  .cbar .pl{color:#9AA3B0;display:grid;place-items:center}
  .fld{flex:1;height:34px;border-radius:11px;background:#F1F3F7;display:flex;align-items:center;
    padding:0 12px;font-size:12px;color:#9EA7B3}

  /* ================= 资料页 ================= */
  .prof{padding:4px 0 14px;text-align:center}
  .prof .nm{font-size:18px;font-weight:600;color:var(--ink);margin-top:10px;letter-spacing:-.4px}
  .prof .stt{font-size:11px;color:var(--blue);margin-top:4px;display:flex;align-items:center;
    justify-content:center;gap:5px}
  .prof .stt i{width:6px;height:6px;border-radius:50%;background:var(--green);display:block}
  .acts{display:flex;justify-content:center;gap:10px;margin:12px 0 14px;padding:0 14px}
  .acts a{flex:1;background:var(--card);border-radius:12px;padding:9px 0;
    display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;color:var(--ink2);
    box-shadow:0 1px 2px rgba(84,112,158,.045);text-decoration:none}
  .acts a .ico{color:var(--blue);width:17px;height:17px}

  /* ================= 新建聊天 ================= */
  .quick{display:flex;gap:11px;padding:0 14px 6px}
  .quick a{flex:1;background:var(--card);border-radius:13px;padding:13px 0 11px;text-align:center;
    text-decoration:none;box-shadow:0 1px 2px rgba(84,112,158,.045)}
  .quick a .cir{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;margin:0 auto 8px;
    background:var(--blue);color:#fff}
  .quick a .cir.g{background:#F1F3F7;color:#7A8492}
  .quick a span{font-size:10.5px;color:var(--ink2)}

  /* ================= 群公告 ================= */
  .notice{margin:0 14px 10px;background:rgba(10,132,255,.07);border-radius:11px;padding:9px 12px;
    display:flex;align-items:center;gap:8px;font-size:11.5px;color:#2C5C93}
  .notice .ico{color:var(--blue);flex:none}
  .notice b{font-weight:600;color:var(--blue)}
  .notice .more{margin-left:auto;color:#9DB4CE;display:grid;place-items:center}

  /* ================= 媒体 ================= */
  .seg{display:flex;gap:3px;margin:0 14px 12px;background:var(--search);border-radius:10px;padding:3px}
  .seg span{flex:1;text-align:center;font-size:12px;color:#8A93A0;padding:6px 0;border-radius:8px}
  .seg span.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(84,112,158,.10)}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:0 14px}
  .cell{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#EBEFF4}
  .cell img{width:100%;height:100%;object-fit:cover;display:block}
  .cell .sel{position:absolute;right:5px;top:5px;width:15px;height:15px;border-radius:50%;
    border:1.4px solid rgba(255,255,255,.95);background:rgba(255,255,255,.28);
    box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .cell .sel.on{background:var(--blue);border-color:#fff}
  .cell .sel.on::after{content:"";position:absolute;left:4px;top:1.6px;width:4px;height:8px;
    border:1.5px solid #fff;border-top:0;border-left:0;transform:rotate(42deg)}
  .mbar{flex:none;display:flex;align-items:center;gap:10px;padding:12px 14px 22px;
    border-top:.5px solid var(--sep);background:rgba(252,253,255,.94)}
  .mbar .pv{font-size:12.5px;color:var(--ink);font-weight:500}
  .mbar .sub{font-size:10px;color:var(--sec);margin-top:1px}
  .sendb{margin-left:auto;width:38px;height:38px;border-radius:50%;background:var(--blue);
    display:grid;place-items:center;color:#fff;box-shadow:0 2px 6px rgba(10,132,255,.20)}

  /* ================= 引导 ================= */
  .splash{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 26px}
  .brand{display:flex;align-items:center;gap:10px;margin-top:76px}
  .brand b{font-size:26px;font-weight:700;color:var(--ink);letter-spacing:-1px}
  .tag{font-size:13px;color:#71798A;line-height:1.8;text-align:center;margin-top:14px;letter-spacing:.3px}
  .tag2{font-size:11px;color:#AEB6C1;margin-top:10px;letter-spacing:.4px}
  .glass{position:relative;width:238px;height:204px;margin:8px 0 0}
  .glass .o1{position:absolute;left:16px;top:18px;width:190px;height:190px;
    border-radius:52% 48% 46% 54% / 56% 52% 48% 44%;
    background:
      radial-gradient(58% 52% at 32% 24%,rgba(255,255,255,.99),rgba(255,255,255,.20) 42%,rgba(255,255,255,0) 68%),
      radial-gradient(74% 74% at 68% 74%,rgba(142,180,238,.88),rgba(188,210,246,.52) 54%,rgba(255,255,255,0) 80%),
      linear-gradient(150deg,rgba(220,233,252,.97),rgba(180,204,242,.84));
    box-shadow:inset 0 0 32px rgba(255,255,255,.96),inset -14px -16px 32px rgba(132,168,230,.46),
      0 18px 38px rgba(126,160,214,.19)}
  .glass .o1::after{content:"";position:absolute;left:20%;top:12%;width:32%;height:22%;
    border-radius:50%;background:rgba(255,255,255,.88);filter:blur(3px);transform:rotate(-18deg)}
  .glass .o2{position:absolute;right:2px;top:2px;width:86px;height:86px;border-radius:50%;
    background:
      radial-gradient(58% 52% at 34% 26%,rgba(255,255,255,.99),rgba(255,255,255,.16) 46%,rgba(255,255,255,0) 70%),
      linear-gradient(150deg,rgba(228,238,253,.95),rgba(194,214,247,.80));
    box-shadow:inset 0 0 18px rgba(255,255,255,.96),inset -8px -9px 18px rgba(146,178,234,.36),
      0 11px 24px rgba(126,160,214,.15)}
  .glass .o3{position:absolute;left:-2px;bottom:2px;width:60px;height:60px;border-radius:50%;
    background:linear-gradient(150deg,rgba(240,245,253,.92),rgba(212,227,248,.68));
    box-shadow:inset 0 0 15px rgba(255,255,255,.93),0 9px 20px rgba(126,160,214,.13)}
  .cta{height:50px;border-radius:25px;background:var(--blue);color:#fff;font-size:15px;font-weight:600;
    display:grid;place-items:center;width:100%;
    box-shadow:0 3px 10px rgba(10,132,255,.22);letter-spacing:.2px}
  .link{margin:14px 0 24px;font-size:13px;color:var(--blue);font-weight:400}
  .dots{display:flex;gap:7px;margin-top:auto;margin-bottom:18px}
  .dots i{width:6px;height:6px;border-radius:50%;background:#D2DAE5;display:block}
  .dots i.on{background:var(--blue);width:18px;border-radius:3px}

  /* ================= 质感层 v3：液态玻璃 / 通透（加强版）=================
     2026-10-06 用户反馈 v2「感觉不出来太大变化」→ 这一版按参考图的"比例"再加一档：
     ① 背景渐变更明显、光晕更大  ② 卡片更透（看得见背景）  ③ 头像/行高按参考图放大比例
     结构、屏数、文案、Tab 数量仍然一个没动。 */
  :root{
    --blue:#4A8BF6;--blue-d:#3D7BE8;
    --sec:#93A0B0;--ter:#BEC6D2;
    --sep:rgba(60,60,67,.045);
    --card:rgba(255,255,255,.50);--search:rgba(255,255,255,.58);
  }
  body{background:linear-gradient(168deg,#E3ECFB 0%,#F1F6FD 42%,#F7F1FB 100%)}
  .ph{box-shadow:0 34px 80px rgba(84,112,158,.24)}
  /* ① 页面级背景：淡蓝紫渐变 + 两个柔光球（"有空气"的关键） */
  .scr{background:linear-gradient(168deg,#E9F1FD 0%,#F5F9FE 44%,#F2EFFC 100%)}
  .scr::before,.scr::after{content:"";position:absolute;border-radius:50%;z-index:0;pointer-events:none}
  .scr::before{width:290px;height:290px;left:-90px;top:-110px;filter:blur(10px);
    background:radial-gradient(circle at 38% 36%,rgba(126,176,255,.62),rgba(126,176,255,0) 62%)}
  .scr::after{width:265px;height:265px;right:-96px;top:140px;filter:blur(12px);
    background:radial-gradient(circle at 60% 40%,rgba(186,166,255,.50),rgba(186,166,255,0) 66%)}
  .scr > *{position:relative;z-index:1}
  /* ② 分组卡：更透（看得见背后渐变）+ 大圆角 + 一道"玻璃边"高光 */
  .grp{background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-radius:24px;box-shadow:0 10px 26px rgba(16,32,64,.05)}
  /* 卡片里不要一条条的分割线（用户 2026-10-06：菜单之间不该有那些间隔） */
  .row + .row::before,.li + .li::before{display:none}
  /* 资料页头像居中（原来是 display:block 靠左，一直都偏 —— 用户指出来了） */
  .prof .av{margin:0 auto}
  /* 在线状态直接标在头像上（右下角绿点），头像下面那行"在线"不要了 */
  .prof .pav{position:relative;width:84px;height:84px;margin:0 auto}
  .prof .pav .av{margin:0}
  .prof .pav .ondot{position:absolute;right:2px;bottom:2px;width:16px;height:16px;border-radius:50%;
    background:linear-gradient(180deg,#5FD97E,#34C759);box-shadow:0 0 0 2.5px rgba(255,255,255,.92)}
  /* 资料页再收一点高度：去掉了分割线之后下面那块还是差 ~18px 才能放下 3 行开关，
     把上下留白压一压（内容一行没少） */
  .prof{padding:2px 0 8px}
  .acts{margin:8px 0 10px}
  .acts a{padding:7px 0}
  /* ③ 更淡的线与辅助字
     ⚠️ 「设置页有 10 行 + 资料页 6 行」，行高一动就会把最后几行挤出屏幕（v2 第一版踩过、v3 也踩了一次）——
     所以行高 / padding 保持原样，房间感靠"头像变大 + 背景更透 + 卡片更玻璃 + Tab 更高"来给。 */
  .row{padding:6px 16px}
  .row.tall{padding:7px 16px}
  .row + .row::before{background:rgba(60,60,67,.045)}
  .row .v{color:#BEC6D2}
  .row .ch{color:#CFD7E0}

  /* ================= v4 补充：全部页面 + 说明条 + 新组件 =================
